name: Validate JP R&D repository
on:
  push:
    branches:
      - main
      - 'researcher/**'
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Researcher engine and ownership governance
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          python scripts/latex/check_engine_enrollment.py
          python scripts/latex/researcher_sequence.py --self-test
          python scripts/latex/test_protected_reservation.py
          python scripts/latex/check_researcher_change_scope.py --self-test
          if [ -n "$PR_BASE" ]; then
            git fetch --no-tags origin "+refs/heads/$PR_BASE:refs/remotes/origin/$PR_BASE"
            python scripts/latex/check_engine_enrollment.py "origin/$PR_BASE" HEAD "$PR_BRANCH"
            python scripts/latex/check_researcher_change_scope.py --base "origin/$PR_BASE" --head HEAD --branch "$PR_BRANCH"
          fi
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_document_families.py
      - run: python scripts/ai_runtime/validate_job.py --self-test
      - run: python scripts/test_site_links.py
      - run: python scripts/build_site.py --out dist
      - run: python scripts/validate_repo.py --site dist
