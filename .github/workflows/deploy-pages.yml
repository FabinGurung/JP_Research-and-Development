name: Build and deploy JP Research & Development hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jp-rd-production-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical production source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Enforce canonical production source
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "main"
          echo "Canonical production Pages source: main"

      - name: Set up exact Node.js toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Confirm exact Node.js and npm versions
        shell: bash
        run: |
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.9.0"

      - name: Determine GitHub Pages base path
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPOSITORY_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            BASE_PATH=""
          else
            BASE_PATH="/$REPOSITORY_NAME"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "GitHub Pages base path: ${BASE_PATH:-/}"

      - name: Install reproducible locked dependencies
        run: npm ci

      - name: Verify source, graph, structural demo and security boundaries
        run: npm run test:pages

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Verify generated Pages output
        run: npm run verify:pages-output

      - name: Verify R&D hub publication routes and boundaries
        shell: bash
        run: |
          test -f out/index.html
          test -f out/aec/index.html
          test -f out/hydropower/index.html
          test -f out/hydropower/proposal-defense/index.html
          test -f out/hydropower-data-schema/index.html
          test -f out/hydropower-data-tables/index.html
          test -f out/hydropower-data-graph/index.html
          test -f out/hydropower-nepal-map/index.html
          test -f out/structural-demo/index.html
          grep -q "Engineering Research System" out/index.html
          grep -q "Hydropower Research" out/index.html
          grep -q "JP Structural Analysis" out/aec/index.html
          echo "R&D hub route/content QA: PASS"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload canonical Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy canonical R&D hub
        id: deployment
        uses: actions/deploy-pages@v4
