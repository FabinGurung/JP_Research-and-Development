name: Validate non-production R&D branch

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
      - name: Install branch dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install
      - name: Run branch checks
        run: npm run test:pages
      - name: Build branch output without publishing
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/JP_Research-and-Development"
        run: npm run build
      - name: Verify output
        run: npm run verify:pages-output
      - run: echo "VALIDATION_ONLY=PASS — production Pages owner remains main."
