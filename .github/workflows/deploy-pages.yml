name: Build canonical JP Research & Development Pages artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jp-rd-production-pages
  cancel-in-progress: false

jobs:
  build-and-stage-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical production source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce canonical source branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "main"
          echo "Canonical editable production source: main"

      - name: Set up exact Node.js toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Confirm exact Node.js and npm versions
        shell: bash
        run: |
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.9.0"

      - name: Determine GitHub Pages base path
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPOSITORY_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            BASE_PATH=""
          else
            BASE_PATH="/$REPOSITORY_NAME"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "GitHub Pages base path: ${BASE_PATH:-/}"

      - name: Install dependencies from recovered package manifest
        shell: bash
        run: |
          # The recovered R&D lineage has a stale package-lock.json.
          # Do not rewrite source history during this Pages repair.
          rm -f package-lock.json
          npm install

      - name: Verify source content, graph, structural demo and security boundaries
        run: npm run test:pages

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Verify generated GitHub Pages output
        run: npm run verify:pages-output

      - name: Verify R&D hub publication routes
        shell: bash
        run: |
          test -f out/index.html
          test -f out/aec/index.html
          test -f out/hydropower/index.html
          test -f out/hydropower/proposal-defense/index.html
          test -f out/hydropower-data-schema/index.html
          test -f out/hydropower-data-tables/index.html
          test -f out/hydropower-data-graph/index.html
          test -f out/hydropower-nepal-map/index.html
          test -f out/structural-demo/index.html
          grep -q "Engineering Research System" out/index.html
          grep -q "Hydropower Research" out/index.html
          grep -q "JP Structural Analysis" out/aec/index.html
          echo "R&D hub route/content QA: PASS"

      - name: Stage generated publication branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          PUBLICATION_BRANCH="structural-analysis-solver-v0.1"
          tar -C out -cf "$RUNNER_TEMP/jp-rd-pages.tar" .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-publication-generated
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf "$RUNNER_TEMP/jp-rd-pages.tar" -C .

          cat > PAGES_PUBLICATION.json <<EOF
          {
            "authority": "GENERATED_PUBLICATION_ARTIFACT",
            "canonical_source_branch": "main",
            "canonical_source_commit": "$SOURCE_SHA",
            "publication_transport_branch": "$PUBLICATION_BRANCH",
            "note": "Do not develop source code on this branch. It is generated only from verified main."
          }
          EOF

          touch .nojekyll
          git add -A
          git commit -m "Publish verified R&D hub from main $SOURCE_SHA"
          git push --force origin "HEAD:$PUBLICATION_BRANCH"
          echo "Generated publication staged on $PUBLICATION_BRANCH"
          echo "A connector-authored follow-up commit is required to trigger legacy branch-mode Pages."

      - name: Read back staged publication branch
        shell: bash
        run: |
          git fetch origin structural-analysis-solver-v0.1
          test -n "$(git rev-parse origin/structural-analysis-solver-v0.1)"
          echo "PUBLICATION_BRANCH_STAGED=PASS"
