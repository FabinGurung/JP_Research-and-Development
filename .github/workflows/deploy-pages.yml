name: Validate historical Next.js R&D branch

on:
  push:
    branches: [github-pages-nextjs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out historical branch
        uses: actions/checkout@v6

      - name: Set up exact Node.js toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Install dependencies from branch manifest
        shell: bash
        run: |
          rm -f package-lock.json
          npm install

      - name: Run historical branch validation only
        run: npm run test:pages

      - name: Build static output for validation only
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/JP_Research-and-Development"
        run: npm run build

      - name: Verify generated output
        run: npm run verify:pages-output

      - name: Confirm non-production boundary
        run: |
          echo "VALIDATION_ONLY=PASS"
          echo "This historical branch cannot deploy to the github-pages environment."
