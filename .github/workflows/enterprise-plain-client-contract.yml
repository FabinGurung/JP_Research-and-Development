name: A9 Historical Plain Contract Source Integrity (Not Client Output)
on:
  push:
    branches: [main]
    paths:
      - 'templates/enterprise/v2/client-contract-simple-lumpsum.tex'
      - 'templates/enterprise/v2/enterprise-shared.sty'
      - 'scripts/document_engineering/render_simple_lumpsum.py'
      - '.github/workflows/enterprise-plain-client-contract.yml'
  pull_request:
    paths:
      - 'templates/enterprise/v2/client-contract-simple-lumpsum.tex'
      - 'scripts/document_engineering/render_simple_lumpsum.py'
      - '.github/workflows/enterprise-plain-client-contract.yml'
  workflow_dispatch:
jobs:
  historical-source-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve previous branch source syntax; no old PDF approval
        run: |
          python3 -m py_compile scripts/document_engineering/render_simple_lumpsum.py
          python3 - <<'PY'
          from pathlib import Path
          assert Path("templates/enterprise/v2/client-contract-simple-lumpsum.tex").is_file()
          assert Path("templates/enterprise/v2/enterprise-shared.sty").is_file()
          print("PASS historical short-form source presence; not a callable v3 client-ready renderer.")
          PY
