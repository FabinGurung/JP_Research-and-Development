name: Validate research foundation
on:
  push:
    branches: [main, feature/rd-a9-research-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r governance/bootstrap/JP_A9_Research_Governance/requirements.txt
      - run: npm run test:pages
      - run: npm run verify:governance
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /JP_Research-and-Development
          GITHUB_PAGES: 'true'
      - run: npm run verify:pages-output
        env:
          NEXT_PUBLIC_BASE_PATH: /JP_Research-and-Development
      - run: npm run verify:manifest
      - name: Verify append-only governance history
        if: github.event_name == 'pull_request'
        env:
          A9_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: governance/bootstrap/JP_A9_Research_Governance
        run: python scripts/validate.py --base-ref "$A9_BASE_SHA"
