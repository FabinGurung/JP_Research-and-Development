name: A9 Historical Enterprise v2 Source Integrity (Not Client Output)
on:
  push:
    branches: [main]
    paths:
      - 'templates/enterprise/v2/**'
      - 'scripts/document_engineering/engine_v2.py'
      - 'scripts/document_engineering/validation_v2.py'
      - '.github/workflows/enterprise-document-v2.yml'
  pull_request:
    paths:
      - 'templates/enterprise/v2/**'
      - 'scripts/document_engineering/engine_v2.py'
      - 'scripts/document_engineering/validation_v2.py'
      - '.github/workflows/enterprise-document-v2.yml'
  workflow_dispatch:
jobs:
  historical-source-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve old source syntax; do not certify outdated client copy
        run: |
          python3 -m py_compile scripts/document_engineering/engine_v2.py scripts/document_engineering/validation_v2.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          roots=Path("templates/enterprise/v2")
          types=json.loads(Path("registry/enterprise-document-types.v2.json").read_text())["types"]
          assert len(types)==14
          assert all((roots / (x["id"] + ".tex")).exists() for x in types)
          print("PASS historical v2 source presence. NOT client-language compliant; no generated output.")
          PY
