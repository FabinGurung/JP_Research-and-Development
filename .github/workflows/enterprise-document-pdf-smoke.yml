name: A9 Historical Enterprise v2 Fourteen Source Inventory
on:
  push:
    branches: [main]
    paths:
      - 'templates/enterprise/v2/**'
      - '.github/workflows/enterprise-document-pdf-smoke.yml'
  workflow_dispatch:
jobs:
  archived-source-inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all 14 historic sources without producing client-facing PDFs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          doc=json.loads(Path("registry/enterprise-document-types.v2.json").read_text())
          sources=[Path("templates/enterprise/v2")/(row["id"]+".tex") for row in doc["types"]]
          assert len(sources)==14 and all(p.is_file() for p in sources)
          print("PASS fourteen historical v2 sources retained. Not client-facing output.")
          PY
