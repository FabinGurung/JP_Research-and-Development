name: Safal Dawadi LaTeX source gate (NO PDF publishing)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check source gate, or attempt authorized exact-font compilation'
        type: choice
        required: true
        default: check
        options:
          - check
          - compile
  push:
    branches:
      - main
      - 'feature/safal-latex-*'
    paths:
      - 'researchers/safal-dawadi/latex/**'
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read source admission gates or perform authorized private build
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'check' }}
        run: python scripts/latex/safal_build.py --mode "$RUN_MODE" --output-dir "$RUNNER_TEMP/safal-candidate"
      - name: Clarify boundary
        run: echo 'Source check is not a PDF. Manual compile cannot run until exact admitted source, private fonts and authorized runner exist. No Drive upload or human scientific approval in this workflow.'
